[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "witness-rag"
version = "0.1.0"
description = "Judgment-free credibility signals inside credibility-aware attention modification (CrAM) for RAG"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
